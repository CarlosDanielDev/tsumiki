plugins = []

[project]
repo = "CarlosDanielDev/tsumiki"
base_branch = "master"
languages = ["swift", "python"]
build_command = "/usr/bin/swift build"
test_command = "/usr/bin/swift test"
run_command = "/usr/bin/swift run"

[sessions]
max_concurrent = 3
stall_timeout_secs = 600
default_model = "opus"
default_mode = "orchestrator"
permission_mode = "bypassPermissions"
allowed_tools = []
max_retries = 2
retry_cooldown_secs = 60
max_prompt_history = 100

[sessions.hollow_retry]
policy = "intent-aware"
work_max_retries = 1
consultation_max_retries = 0

[sessions.context_overflow]
overflow_threshold_pct = 70
auto_fork = true
commit_prompt_pct = 50
max_fork_depth = 5

[sessions.conflict]
enabled = true
policy = "warn"

[sessions.completion_gates]
enabled = true

# Toolchain note: /usr/bin/swift is the Xcode-bundled toolchain.
# `which swift` resolves to swiftly's Swift 6.1 which is incompatible
# with the macOS 26 SDK — always pin to /usr/bin/swift in gates.

[[sessions.completion_gates.commands]]
name = "swift-build"
run = "/usr/bin/swift build"
required = true

[[sessions.completion_gates.commands]]
name = "swift-test"
run = "/usr/bin/swift test"
required = true

[[sessions.completion_gates.commands]]
name = "python-tests"
run = "python3 -m unittest discover scripts/tests"
required = true

[[sessions.completion_gates.commands]]
name = "lint-no-hardcoded"
run = "python3 -m scripts.lint_no_hardcoded Sources/TsumikiComponents"
required = true

[budget]
per_session_usd = 5.0
total_usd = 50.0
alert_threshold_pct = 80

[github]
issue_filter_labels = ["maestro:ready"]
auto_pr = true
cache_ttl_secs = 300
auto_merge = false
merge_method = "squash"

[provider]
kind = "github"
issue_filter_labels = ["maestro:ready"]
auto_pr = true
auto_merge = false
merge_method = "squash"
cache_ttl_secs = 300

[notifications]
desktop = true
slack = false
slack_rate_limit_per_min = 10

# Route P0 to Opus (catalog + plan-C work needs deep reasoning),
# everything else can ride on Sonnet.
[models.routing]
"priority:P0" = "opus"
"priority:P1" = "sonnet"
"priority:P2" = "sonnet"
"area:migration" = "opus"

[gates]
enabled = true
test_command = "/usr/bin/swift test"
ci_poll_interval_secs = 30
ci_max_wait_secs = 1800

[gates.ci_auto_fix]
enabled = true
max_retries = 3

[review]
enabled = false
command = ""
reviewers = []

[concurrency]
heavy_task_labels = ["area:migration"]
heavy_task_limit = 1

[monitoring]
work_tick_interval_secs = 10

[modes]

[tui]
ascii_icons = false
show_mascot = true
mascot_style = "sprite"

[tui.theme]
preset = "retro"

[tui.theme.overrides]

[tui.layout]
mode = "horizontal"
density = "compact"
preview_ratio = 65
activity_log_height = 20

[flags]

[turboquant]
